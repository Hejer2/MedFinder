name: Continuous Delivery (CD) & Production Deployment

on:
  push:
    branches: [ master, main ]

permissions:
  contents: read
  packages: write

jobs:
  verify-tests:
    name: Verify All Tests Before Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Verify Backend Unit & E2E Tests
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npx prisma db push --accept-data-loss
          npm run test
          npm run test:e2e
        env:
          JWT_SECRET: 'test_jwt_secret_ci_key_32_characters_minimum'
          REFRESH_SECRET: 'test_refresh_secret_ci_key_32_characters'
          DATABASE_URL: 'file:./test_cd.db'

      - name: Verify Frontend Unit Tests & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run test
          npm run build
        env:
          VITE_API_URL: ''

  build-and-publish:
    name: Build & Publish Docker Images to GHCR
    needs: verify-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------
      # 1. Build and Push Backend Image
      # -------------------------------------------------------------
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}-backend:latest
            ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}-backend:${{ github.sha }}

      # -------------------------------------------------------------
      # 2. Build and Push Frontend Image
      # -------------------------------------------------------------
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}-frontend:latest
            ghcr.io/${{ steps.repo_name.outputs.REPO_LOWER }}-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=

  trigger-cloud-deploy:
    name: Trigger Cloud Deployment (Render / Webhook)
    needs: build-and-publish
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}

    steps:
      - name: Trigger Render Webhook Deployment
        run: |
          echo "🚀 Triggering cloud deployment via secure deploy hook..."
          curl -s -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
          echo "✅ Cloud deploy webhook triggered successfully."
