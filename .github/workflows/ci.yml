name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend CI (Test & Build)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:${{ github.workspace }}/backend/prisma/test_ci.db"
      JWT_SECRET: 'test_jwt_secret_ci_key_32_characters_minimum'
      REFRESH_SECRET: 'test_refresh_secret_ci_key_32_characters'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Validate Prisma Schema & Generate Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Initialize Test Database Schema
        working-directory: ./backend
        run: npx prisma db push --accept-data-loss

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: npm run test

      - name: Run Backend E2E Security Tests (41 Tests)
        working-directory: ./backend
        run: npm run test:e2e

      - name: Build Backend Application
        working-directory: ./backend
        run: npm run build

  frontend-ci:
    name: Frontend CI (Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: ./frontend
        run: npm run test

      - name: Build Frontend Application
        working-directory: ./frontend
        env:
          VITE_API_URL: ''
        run: npm run build

  docker-build-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: medfinder-backend:ci-test

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: medfinder-frontend:ci-test
          build-args: |
            VITE_API_URL=
