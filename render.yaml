services:
  # ----------------------------------------------------------------------------
  # Backend NestJS REST API
  # ----------------------------------------------------------------------------
  - type: web
    name: medfinder-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: medfinder-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://medfinder-frontend.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend React SPA
  # ----------------------------------------------------------------------------
  - type: web
    name: medfinder-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: VITE_API_URL
        value: https://medfinder-backend.onrender.com

databases:
  # ----------------------------------------------------------------------------
  # Managed PostgreSQL Database (Free Tier)
  # ----------------------------------------------------------------------------
  - name: medfinder-postgres
    plan: free
    region: frankfurt
    databaseName: medfinder
    user: medfinder
