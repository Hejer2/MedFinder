
services:
  database:
    image: postgis/postgis:15-3.4
    container_name: medfinder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medfinder_secret}
      POSTGRES_DB: ${POSTGRES_DB:-medfinder}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medfinder} -d ${POSTGRES_DB:-medfinder}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medfinder-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medfinder-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-medfinder}:${POSTGRES_PASSWORD:-medfinder_secret}@database:5432/${POSTGRES_DB:-medfinder}?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change_in_production_jwt_secret}
      REFRESH_SECRET: ${REFRESH_SECRET:-change_in_production_refresh_secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    ports:
      - '3000:3000'
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      database:
        condition: service_healthy
    networks:
      - medfinder-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: medfinder-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medfinder-network

volumes:
  postgres-data:
  backend-uploads:

networks:
  medfinder-network:
    driver: bridge

